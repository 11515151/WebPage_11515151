<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="60%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6600" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#FFF5EE"/>
  <circle cx="200" cy="200" r="150" fill="#FFE8D6" opacity="0.6"/>
  <!-- Drink Cup -->
  <g filter="url(#shadow)">
    <!-- Straw -->
    <rect x="210" y="50" width="16" height="150" rx="8" fill="#FF7043" transform="rotate(12 218 125)"/>
    <!-- Lid -->
    <ellipse cx="200" cy="140" rx="85" ry="18" fill="#FFFFFF" stroke="#FFD8BE" stroke-width="3"/>
    <rect x="125" y="130" width="150" height="12" rx="6" fill="#FFF" stroke="#FFD8BE" stroke-width="2"/>
    <!-- Cup Body -->
    <path d="M130 142 L145 320 Q146 335 160 335 L240 335 Q254 335 255 320 L270 142 Z" fill="url(#cupGrad)"/>
    <!-- Liquid -->
    <path d="M136 185 L147 318 Q148 330 160 330 L240 330 Q252 330 253 318 L264 185 Q235 195 200 185 Q165 175 136 185 Z" fill="url(#teaGrad)"/>
    <!-- Fruit Slices inside -->
    <circle cx="175" cy="230" r="24" fill="url(#orangeGrad)"/>
    <circle cx="175" cy="230" r="18" fill="#FFF8E1" opacity="0.7"/>
    <circle cx="175" cy="230" r="7" fill="#FF8F00"/>
    <circle cx="220" cy="275" r="20" fill="#FF5252" opacity="0.85"/>
    <circle cx="170" cy="295" r="12" fill="#FFD54F" opacity="0.9"/>
    <!-- Bubbles / Ice cubes -->
    <rect x="195" y="210" width="22" height="22" rx="5" fill="#FFFFFF" opacity="0.4" transform="rotate(15 206 221)"/>
    <rect x="225" y="240" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 234 249)"/>
    <!-- Cup Highlight -->
    <path d="M140 160 L150 310" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Fruit Decor Outside -->
  <g transform="translate(70, 260)">
    <circle cx="30" cy="30" r="30" fill="url(#orangeGrad)"/>
    <path d="M10 30 Q30 50 50 30" stroke="#FFF" stroke-width="3" fill="none" opacity="0.8"/>
  </g>
  <text x="200" y="375" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#E64A00">爆汁雙響水果茶</text>
</svg>
